<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flowbite Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    {% block extra_css %}{% endblock %}
</head>
<body>
{% if request.path == '/' %}
<div id="announcement-bar" class="flex items-center p-3 text-blue-800 bg-blue-50 border-b border-blue-200 dark:bg-gray-800 dark:text-blue-400 dark:border-gray-700" role="alert">
  <svg class="shrink-0 w-4 h-4 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
    <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
  </svg>

  <div class="ms-3 text-sm font-medium flex-1 overflow-hidden min-w-0">
    <span class="block truncate md:whitespace-normal">本周六 10:00-12:00 维护</span>
  </div>

  <button type="button" id="announcement-close" class="ms-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-7 w-7 dark:bg-gray-800 dark:text-blue-400 dark:hover:bg-gray-700 flex-shrink-0" aria-label="Close">
    <span class="sr-only">Close</span>
    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
    </svg>
  </button>
</div>

<script>
(function () {
  const bar = document.getElementById('announcement-bar');
  const btn = document.getElementById('announcement-close');
  if (!bar || !btn) return;

  const KEY = 'closedAnnouncement';
  const TTL_MS = 7 * 24 * 60 * 60 * 1000;

  function shouldShow() {
    const v = localStorage.getItem(KEY);
    if (!v) return true;
    const t = Number(v);
    if (!Number.isFinite(t)) return true;
    return (Date.now() - t) > TTL_MS;
  }

  function render() {
    bar.style.display = shouldShow() ? 'flex' : 'none';
  }

  btn.addEventListener('click', function () {
    localStorage.setItem(KEY, String(Date.now()));
    bar.style.display = 'none';
  });

  render();
})();
</script>
{% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
