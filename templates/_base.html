<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flowbite Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 绔欏唴鍏憡鏉?- 浠呭湪棣栭〉鏄剧ず -->
    {% if request.path == '/' %}
    <div id="announcement-bar" role="alert" class="flex items-center p-4 mb-4 text-blue-800 rounded-lg bg-blue-50 dark:bg-gray-800 dark:text-blue-400">
        <div class="flex-1 min-w-0 ms-3">
            <div class="text-sm font-medium truncate">
                鏈懆鍏?10:00-12:00 缁存姢
            </div>
        </div>
        <button id="announcement-close" type="button" class="flex-shrink-0 ms-4 -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8 dark:bg-gray-800 dark:text-blue-400 dark:hover:bg-gray-700" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    {% block extra_js %}{% endblock %}
    
    <script>
        // 鍏憡鏉￠€昏緫
        (function() {
            const announcementBar = document.getElementById('announcement-bar');
            const closeButton = document.getElementById('announcement-close');
            const STORAGE_KEY = 'closedAnnouncement';
            const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;

            // 闈為椤垫垨DOM涓嶅瓨鍦ㄦ椂鐩存帴閫€鍑?
            if (!announcementBar || !closeButton) {
                return;
            }

            // 妫€鏌ocalStorage鏄惁鍙敤
            function isLocalStorageAvailable() {
                try {
                    const key = '__test__';
                    window.localStorage.setItem(key, key);
                    window.localStorage.removeItem(key);
                    return true;
                } catch (e) {
                    return false;
                }
            }

            // 妫€鏌ユ槸鍚﹂渶瑕佹樉绀哄叕鍛婃潯
            function shouldShowAnnouncement() {
                if (!isLocalStorageAvailable()) {
                    return true;
                }

                const closedTime = localStorage.getItem(STORAGE_KEY);
                if (!closedTime) {
                    return true;
                }

                const currentTime = new Date().getTime();
                const timeDiff = currentTime - parseInt(closedTime);
                return timeDiff > SEVEN_DAYS;
            }

            // 闅愯棌鍏憡鏉?
            function hideAnnouncement() {
                announcementBar.style.display = 'none';
                if (isLocalStorageAvailable()) {
                    localStorage.setItem(STORAGE_KEY, new Date().getTime().toString());
                }
            }

            // 鍒濆鍖?
            function init() {
                if (!shouldShowAnnouncement()) {
                    announcementBar.style.display = 'none';
                }

                closeButton.addEventListener('click', hideAnnouncement);
            }

            // 椤甸潰鍔犺浇瀹屾垚鍚庢墽琛?
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
