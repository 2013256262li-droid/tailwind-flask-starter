<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flowbite Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Announcement Banner - Only show on homepage -->
    {% if request.endpoint == 'index' %}
    <div id="announcement-banner" class="flex items-center p-4 text-blue-800 rounded-none bg-blue-50 dark:bg-gray-800 dark:text-blue-400" role="alert">
        <svg class="shrink-0 w-4 h-4 flex-none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
        </svg>
        <span class="sr-only">Info</span>
        <div class="ms-3 text-sm font-medium min-w-0 flex-1">
            <span class="block truncate">本周六 10:00-12:00 维护</span>
        </div>
        <button type="button" id="announcement-close" class="flex-none -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8 dark:bg-gray-800 dark:text-blue-400 dark:hover:bg-gray-700" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script>
        // Announcement banner functionality - only runs on homepage
        document.addEventListener('DOMContentLoaded', function() {
            const banner = document.getElementById('announcement-banner');
            if (!banner) return; // Exit if banner doesn't exist (non-homepage)
            
            const closeBtn = document.getElementById('announcement-close');
            const storageKey = 'announcement_closed';
            
            // Check if banner was closed within the last 7 days
            const closedTime = localStorage.getItem(storageKey);
            if (closedTime) {
                const daysSinceClosed = (Date.now() - parseInt(closedTime)) / (1000 * 60 * 60 * 24);
                if (daysSinceClosed < 7) {
                    banner.style.display = 'none';
                    return;
                }
            }
            
            // Show banner and handle close
            banner.style.display = 'flex';
            
            closeBtn.addEventListener('click', function() {
                banner.style.display = 'none';
                localStorage.setItem(storageKey, Date.now().toString());
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
