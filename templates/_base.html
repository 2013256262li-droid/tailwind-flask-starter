<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flowbite Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if request.path == '/' %}
    <!-- Announcement Bar -->
    <div id="announcement-bar" class="flex items-center p-4 text-blue-800 rounded-lg bg-blue-50 dark:bg-gray-800 dark:text-blue-400" role="alert" style="display: none;">
        <svg class="shrink-0 w-4 h-4 flex-shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
        </svg>
        <span class="sr-only">Info</span>
        <div class="ms-3 text-sm font-medium min-w-0 flex-1 truncate">
            闁哄牜鍓欓幊鍡涘礂?10:00-12:00 缂備礁鐡ㄦ慨?
        </div>
        <button type="button" id="announcement-close" class="ms-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8 flex-shrink-0 dark:bg-gray-800 dark:text-blue-400 dark:hover:bg-gray-700" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script>
        // Announcement bar logic
        (function() {
            try {
                // Check if announcement bar exists (only on homepage)
                const announcementBar = document.getElementById('announcement-bar');
                const closeButton = document.getElementById('announcement-close');
    if (! || !) { return; }
                
                if (!announcementBar || !closeButton) {
                    // Not on homepage, safely exit
                    return;
                }

                // Check if localStorage is available
                if (typeof localStorage === 'undefined') {
                    // localStorage not available, show announcement bar always
                    announcementBar.style.display = 'flex';
                    return;
                }

                const closedAnnouncement = localStorage.getItem('closedAnnouncement');

                if (!closedAnnouncement) {
                    // First time visit or never closed - show announcement
                    announcementBar.style.display = 'flex';
                } else {
                    // Check if 7 days have passed
                    const closedTime = parseInt(closedAnnouncement);
                    const currentTime = new Date().getTime();
                    const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
                    
                    if (currentTime - closedTime > sevenDaysInMs) {
                        // More than 7 days - show announcement again
                        announcementBar.style.display = 'flex';
                    }
                }

                // Close button click handler
                closeButton.addEventListener('click', function() {
                    announcementBar.style.display = 'none';
                    try {
                        localStorage.setItem('closedAnnouncement', new Date().getTime().toString());
                    } catch (e) {
                        // Ignore localStorage errors
                    }
                });
            } catch (e) {
                // If any error occurs, try to show the announcement bar if it exists
                const announcementBar = document.getElementById('announcement-bar');
                if (announcementBar) {
                    announcementBar.style.display = 'flex';
                }
            }
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
