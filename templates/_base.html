<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flowbite Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Announcement Bar -->
    {% if request.path in ['/', '/index'] %}
    <div id="announcement-bar" class="flex items-center justify-between p-4 bg-blue-50 text-blue-800 dark:bg-gray-800 dark:text-blue-400">
        <div class="text-sm font-medium line-clamp-2 max-w-[90%]">
            本周六 10:00-12:00 维护
        </div>
        <button id="close-announcement" class="ms-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8 dark:bg-gray-800 dark:text-blue-400 dark:hover:bg-gray-700" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script>
        // 检查localStorage中是否有已关闭公告的记录
        document.addEventListener('DOMContentLoaded', function() {
            const announcementBar = document.getElementById('announcement-bar');
            const closeButton = document.getElementById('close-announcement');
            
            // 检查是否已经关闭过公告（7天有效期）
            const closedDate = localStorage.getItem('announcementClosed');
            if (closedDate) {
                const closedTime = new Date(closedDate).getTime();
                const sevenDays = 7 * 24 * 60 * 60 * 1000;
                if (Date.now() - closedTime < sevenDays) {
                    announcementBar.style.display = 'none';
                }
            }
            
            // 关闭按钮点击事件
            closeButton.addEventListener('click', function() {
                announcementBar.style.display = 'none';
                localStorage.setItem('announcementClosed', new Date().toISOString());
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
