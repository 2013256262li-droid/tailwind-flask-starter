<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flowbite Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 站内公告条 - 只在首页显示 -->
    {% if request.endpoint == 'index' %}
    <div id="announcement-bar" class="flex items-center p-3 text-blue-800 bg-blue-50 border-b border-blue-200 dark:bg-gray-800 dark:text-blue-400 dark:border-gray-700" role="alert">
        <svg class="shrink-0 w-4 h-4 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
        </svg>
        <span class="sr-only">公告</span>
        <div class="ms-3 text-sm font-medium flex-1 overflow-hidden">
            <span class="block truncate md:whitespace-normal">本周六 10:00-12:00 维护</span>
        </div>
        <button type="button" id="announcement-close" class="ms-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-7 w-7 dark:bg-gray-800 dark:text-blue-400 dark:hover:bg-gray-700 flex-shrink-0" aria-label="关闭公告">
            <span class="sr-only">关闭</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    {% block extra_js %}{% endblock %}
    
    <!-- 公告条控制脚本 -->
    <script>
        // 检查是否已经关闭过公告条
        function shouldShowAnnouncement() {
            const closedTime = localStorage.getItem('announcementClosedTime');
            if (!closedTime) return true;
            
            const closedDate = new Date(closedTime);
            const now = new Date();
            const daysDiff = (now - closedDate) / (1000 * 60 * 60 * 24);
            
            return daysDiff > 7; // 7天后重新显示
        }

        // 显示或隐藏公告条
        function updateAnnouncementVisibility() {
            const announcementBar = document.getElementById('announcement-bar');
            if (shouldShowAnnouncement()) {
                announcementBar.style.display = 'flex';
            } else {
                announcementBar.style.display = 'none';
            }
        }

        // 关闭公告条
        function closeAnnouncement() {
            const announcementBar = document.getElementById('announcement-bar');
            announcementBar.style.display = 'none';
            localStorage.setItem('announcementClosedTime', new Date().toISOString());
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateAnnouncementVisibility();
            
            // 绑定关闭按钮事件
            const closeButton = document.getElementById('announcement-close');
            if (closeButton) {
                closeButton.addEventListener('click', closeAnnouncement);
            }
        });
    </script>
</body>
</html>
